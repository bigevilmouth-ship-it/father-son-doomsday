r{animation-delay:-2.5s}.unit:nth-child(3):after{animation-delay:-5s}.unit:nth-child(4):after{animation-delay:-7.5s}.number{font:800 clamp(43px,7.4vw,102px)/.95 'Barlow Condensed',Impact,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.05em;color:#eaffee;text-shadow:0 2px 3px #000,0 0 30px #72ff9b80}.unit label{display:block;margin-top:9px;font-size:clamp(10px,1.3vw,14px);font-weight:700;letter-spacing:.29em;color:#a2c5a9}.motto{font:700 clamp(17px,2.2vw,25px) Rajdhani,sans-serif;letter-spacing:.52em;color:#c9fbd1;text-shadow:0 0 30px #7aff9b88;margin:0 0 6px}.foot{position:absolute;bottom:33px;font-size:11px;letter-spacing:.4em;color:#83a48b}.sound{position:fixed;z-index:9;right:34px;top:30px;border:1px solid #8cffa170;background:#07150cdb;color:#d6ffe0;padding:10px 14px;letter-spacing:.17em;font-weight:700;font-size:12px;backdrop-filter:blur(8px)}.sound:hover,.start:hover{border-color:#caffd6;background:#21402b}.gate{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;background:radial-gradient(ellipse at 50% 50%,#16422a 0%,#06120b 40%,#010302 85%);transition:opacity 1.3s,visibility 1.3s}.gate:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#fff1 0 1px,transparent 1px 6px);opacity:.3}.gate>*{position:relative}.gate .glyph{font-size:62px;color:#b0ffc1;text-shadow:0 0 35px #68ff95;margin-bottom:28px}.gate .pre{letter-spacing:.48em;color:#9bc8a4;font-size:13px}.gate h2{font:900 clamp(70px,12vw,145px)/.8 'Barlow Condensed',Impact,sans-serif;letter-spacing:.08em;margin:28px 0;text-shadow:0 5px #000,0 0 65px #63ff9566}.gate h2 span{display:block;font-size:.48em;letter-spacing:.24em;margin-bottom:15px}.gate .desc{letter-spacing:.3em;color:#c4dfc8}.start{margin-top:32px;border:1px solid #a7ffb7;background:linear-gradient(130deg,#315c3b,#102718);color:#f0fff2;padding:17px 35px;letter-spacing:.25em;font-size:17px;font-weight:700;box-shadow:0 0 45px #56f78c2b;transition:.25s}.gate.hidden{opacity:0;visibility:hidden}.finale{display:none;font:900 clamp(65px,11vw,150px)/.82 'Barlow Condensed',Impact,sans-serif;color:#d5ffdf;text-shadow:0 0 60px #69ff94;letter-spacing:.05em;margin:30px 0}.finished .timer,.finished .date{display:none}.finished .finale{display:block;animation:enter 1.5s both}.content{animation:enter 1.8s both}@keyframes enter{from{opacity:0;transform:translateY(25px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes glint{0%,15%{transform:translateX(-120%) rotate(20deg)}42%,100%{transform:translateX(120%) rotate(20deg)}}@keyframes ribPulse{from{opacity:.38}to{opacity:.9}}@keyframes sway{to{transform:rotate(12deg) scale(1.15)}}@media(max-width:600px){.corners{inset:9px}.topline{top:24px;left:25px;transform:none;font-size:9px;letter-spacing:.2em}.sound{right:21px;top:16px;padding:8px;font-size:10px}.crest{width:38px;height:38px;margin-bottom:12px}.title{font-size:clamp(64px,17vw,115px)}.title small{font-size:.4em}.timer{gap:6px}.unit{padding:12px 2px}.unit label{letter-spacing:.07em;font-size:10px}.number{font-size:clamp(40px,10vw,70px)}.motto{letter-spacing:.25em}.date{letter-spacing:.13em}.divider{margin:22px 0 17px}.foot{bottom:26px;font-size:9px}.hall{opacity:.75}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

</style></head><body><div id="world" aria-hidden="true"><div class="hall"><div class="ceiling"></div><div class="floor"></div><div class="wall left"></div><div class="wall right"></div><div class="void"></div><div class="pillars"></div><div class="rib"></div><div class="beams"></div></div></div><canvas id="magic" aria-hidden="true"></canvas><div id="vignette"></div><div class="corners"></div><div class="topline">THE HOUR APPROACHES</div><button class="sound" id="sound" aria-label="Mute soundtrack">♫ SOUND ON</button><main class="content" id="main"><div class="crest"><svg viewBox="0 0 100 100" fill="none" stroke="#9dffb4" stroke-width="3"><path d="M50 3 88 25v50L50 97 12 75V25Z"/><path d="M50 16 76 31v38L50 84 24 69V31Z"/><path d="m34 62 16-34 16 34M40 51h20" stroke-width="5"/></svg></div><p class="intro">An event years in the making</p><h1 class="title"><small>Father–Son</small><strong>Doomsday</strong></h1><div class="divider"></div><div class="date">DECEMBER 19, 2026 <span aria-hidden="true">✦</span> 10:00 AM CENTRAL</div><section class="timer" aria-label="Countdown to Father-Son Doomsday"><div class="unit"><div class="number" id="days">00</div><label>DAYS</label></div><div class="unit"><div class="number" id="hours">00</div><label>HOURS</label></div><div class="unit"><div class="number" id="minutes">00</div><label>MINUTES</label></div><div class="unit"><div class="number" id="seconds">00</div><label>SECONDS</label></div></section><div class="finale">DOOMSDAY<br>HAS ARRIVED</div><p class="motto">STAND AS ONE</p><div class="foot">THE COUNTDOWN HAS BEGUN</div></main><section class="gate" id="gate"><div class="glyph">◇</div><p class="pre">YOUR PRESENCE IS REQUIRED</p><h2><span>FATHER–SON</span>DOOMSDAY</h2><p class="desc">THE COUNTDOWN AWAITS</p><button class="start" id="start">INITIATE DOOMSDAY</button></section><audio id="track" src="soundtrack.mp3" preload="metadata" loop></audio><script>
'use strict';const target=Date.parse('2026-12-19T10:00:00-06:00');const track=document.getElementById('track');track.volume=.82;track.addEventListener('error',()=>{document.getElementById('sound').textContent='⚠ AUDIO FILE NOT FOUND';console.error('Soundtrack failed to load',track.error)});let started=false,soundOn=true,finished=false,analyser=null,frequency=null,audioContext=null;function update(){const ms=Math.max(0,target-Date.now());const vals=[Math.floor(ms/86400000),Math.floor(ms/3600000)%24,Math.floor(ms/60000)%60,Math.floor(ms/1000)%60];['days','hours','minutes','seconds'].forEach((id,i)=>document.getElementById(id).textContent=String(vals[i]).padStart(2,'0'));if(ms===0&&!finished){finished=true;document.getElementById('main').classList.add('finished');}}update();setInterval(update,250);
function attachAnalyzer(){try{audioContext=new(window.AudioContext||window.webkitAudioContext)();const source=audioContext.createMediaElementSource(track);analyser=audioContext.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.85;frequency=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);analyser.connect(audioContext.destination)}catch(e){console.warn('Audio visualization unavailable',e)}}
document.getElementById('start').addEventListener('click',async()=>{started=true;document.getElementById('gate').classList.add('hidden');document.body.classList.add('activated');window.dispatchEvent(new Event('doom-start'));if(soundOn){try{await track.play();if(location.protocol!=='file:'&&!audioContext){attachAnalyzer();await audioContext?.resume()}}catch(e){console.warn('Audio playback failed',e);document.getElementById('sound').textContent='⚠ AUDIO — TAP TO RETRY'}}});document.getElementById('sound').addEventListener('click',async()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'♫ SOUND ON':'♫ SOUND OFF';document.getElementById('sound').setAttribute('aria-label',soundOn?'Mute soundtrack':'Play soundtrack');if(!started)return;if(soundOn){try{await track.play();if(location.protocol!=='file:'&&!audioContext){attachAnalyzer();await audioContext?.resume()}}catch(e){console.warn(e);document.getElementById('sound').textContent='⚠ AUDIO — TAP TO RETRY'}}else track.pause()});
// Floating eldritch sigils, enlarged and concentrated along both sides of the scene.
(()=>{const c=document.getElementById('magic'),g=c.getContext('2d',{alpha:true});if(!g)return;
const reduce=matchMedia('(prefers-reduced-motion: reduce)');const sigils=['ᛟ','ᚷ','ᛉ','ᚨ','ᛞ','ᛝ','ᚱ','ᛇ','ᚹ','ᛏ'];const rand=(a,b)=>a+Math.random()*(b-a);
let w=0,h=0,dpr=1,runes=[],sparks=[],sprites=[],raf=0,active=false,last=0,resizeTimer=0;
function sprite(char,size){const pad=22,extent=Math.ceil(size*1.85+pad*2),s=document.createElement('canvas');s.width=s.height=extent;const x=s.getContext('2d');x.translate(extent/2,extent/2);x.strokeStyle='rgba(78,255,132,.48)';x.lineWidth=1.3;x.shadowColor='#2aff78';x.shadowBlur=12;x.beginPath();x.arc(0,0,size*.69,0,Math.PI*2);x.stroke();x.beginPath();x.arc(0,0,size*.85,Math.PI*.15,Math.PI*1.68);x.stroke();for(let k=0;k<6;k++){const a=k*Math.PI/3;x.beginPath();x.moveTo(Math.cos(a)*size*.7,Math.sin(a)*size*.7);x.lineTo(Math.cos(a)*size*.84,Math.sin(a)*size*.84);x.stroke()}x.font=`${size}px Georgia,serif`;x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(159,255,181,.9)';x.shadowBlur=17;x.fillText(char,0,0);return s}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.25);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0);const small=w<650,count=small?12:24;const size=small?65:94;sprites=sigils.map(ch=>sprite(ch,size));runes=Array.from({length:count},(_,i)=>({x:(i%2===0?rand(.035,.265):rand(.735,.965))*w,y:rand(.06,.94)*h,size:rand(.65,1.18),phase:rand(0,7),speed:rand(.07,.25),index:i%sigils.length,alpha:rand(.35,.78)}));sparks=Array.from({length:small?35:65},()=>({x:rand(0,w),y:rand(0,h),r:rand(.5,2),phase:rand(0,7),speed:rand(.1,.65)}));}
function draw(t,dt){g.clearRect(0,0,w,h);let energy=.25;if(analyser&&soundOn&&!track.paused){analyser.getByteFrequencyData(frequency);let sum=0;for(let i=2;i<35;i++)sum+=frequency[i];energy=Math.min(1,sum/(33*190))}g.globalCompositeOperation='screen';for(let i=0;i<runes.length;i++){const r=runes[i];r.y-=r.speed*dt/16.67;if(r.y<-125){r.y=h+125;r.x=(i%2===0?rand(.035,.265):rand(.735,.965))*w}const pulse=.7+.3*Math.sin(t*.0013+r.phase),alpha=Math.min(1,r.alpha*pulse*(.85+energy*.35)),s=sprites[r.index],sz=s.width*r.size;g.globalAlpha=alpha;g.drawImage(s,r.x+Math.sin(t*.00025+r.phase)*Math.min(23,w*.025)-sz/2,r.y-sz/2,sz,sz)}g.globalAlpha=1;for(const s of sparks){s.y-=s.speed*dt/16.67;if(s.y<0){s.y=h;s.x=rand(0,w)}g.fillStyle=`rgba(123,255,154,${.14+.3*Math.sin(t*.001+s.phase)**2})`;g.beginPath();g.arc(s.x,s.y,s.r,0,Math.PI*2);g.fill()}g.globalCompositeOperation='source-over'}
function tick(t){if(!active||document.hidden||reduce.matches){raf=0;return}raf=requestAnimationFrame(tick);if(t-last<33)return;const dt=Math.min(t-last||33,80);last=t;draw(t,dt)}
function start(){if(active||document.hidden||reduce.matches)return;active=true;last=0;raf=requestAnimationFrame(tick)}function stop(){active=false;if(raf)cancelAnimationFrame(raf);raf=0}
window.addEventListener('doom-start',start);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(started)start()});reduce.addEventListener?.('change',()=>{if(reduce.matches)stop();else if(started)start()});addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const running=active;stop();resize();if(running)start()},180)});resize();})();
